[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tungelligence-agentic-rag"
version = "1.5.4"
description = "A deployable local-LLM agentic RAG system with adaptive retrieval and evaluation."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.2,<3.0",
  "pypdf>=5.0,<7.0",
  "python-docx>=1.1,<2.0",
  "numpy>=2.0,<3.0",
  "faiss-cpu>=1.8,<2.0",
  "sentence-transformers>=3.0,<6.0",
  "reportlab>=4.0,<5.0",
  "python-multipart>=0.0.9,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10.0",
  "pytest-cov>=5.0,<7.0",
  "httpx>=0.27,<1.0",
]

[project.scripts]
tungelligence = "app.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.coverage.run]
source = ["app"]
omit = ["app/ui/*", "app/cli.py"]

[tool.coverage.report]
exclude_also = [
  "raise NotImplementedError",
]
